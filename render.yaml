# Render Blueprint for the Sat2Soil API (services/api). The user connects it in the Render dashboard:
# New → Blueprint → pick this repository. Secrets marked `sync: false` are entered there, never here.
services:
  - type: web
    name: sat2soil-api
    runtime: python
    rootDir: services/api
    # Frankfurt is the Render region closest to the Supabase project (eu-west-3, Paris).
    region: frankfurt
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # --proxy-headers: rate limits use the visitor's IP from X-Forwarded-For, not Render's proxy.
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: ENVIRONMENT
        value: production
      # Exact web origins, comma-separated, e.g. https://sat2soil.vercel.app (no wildcards).
      - key: CORS_ORIGINS
        sync: false
      # Supabase session pooler URL (IPv4): postgresql://postgres.<ref>:<password>@aws-0-eu-west-3.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Random value generated by Render; signs demo session tokens.
      - key: DEMO_SESSION_SECRET
        generateValue: true
